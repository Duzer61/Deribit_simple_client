[project]
name = "deribit-simple-client"
version = "0.1.0"
description = "Deribit index price tracker: Celery collector, PostgreSQL storage and FastAPI reader"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "celery[redis]>=5.6",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deribit_tracker"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "LOG",
    # Детекторы мёртвого кода и YAGNI-мусора:
    "ARG",      # неиспользуемые аргументы функций и методов
    "RUF100",   # неиспользуемые `# noqa`
    "ERA001",   # закомментированный код
    "PIE790",   # бессмысленный `pass`
]

[tool.ruff.lint.per-file-ignores]
# Аргументы фикстур pytest нужны как зависимости, а не для использования в теле теста.
"tests/**" = ["ARG001", "ARG002", "ARG005"]
# `request` обязателен сигнатурой обработчика исключений FastAPI.
"src/deribit_tracker/api/exception_handlers.py" = ["ARG001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: tests that require a running PostgreSQL instance",
]
